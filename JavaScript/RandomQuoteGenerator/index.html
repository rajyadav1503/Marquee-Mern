<html lang="en">
  <head>

  </head>
  <body>

        {

        {

      let button = document.getElementsByTagName('button')[0];
      
      //console.log(random);

      button.addEventListener('click',() => {

        let random = Math.floor(Math.random() * quotes.length);

        let selectedQuote = quotes[random];

        console.log(`Quote of the day is : ${selectedQuote.quote}`);
        console.log(`Created by : ${selectedQuote.createdBy}`);
        document.getElementsByTagName('h3')[0].innerText=selectedQuote.quote;
        document.getElementsByTagName('p')[0].innerText=selectedQuote.createdBy;
        
      });
      
      let quotePara = document.getElementsByTagName('h3')[0];
      let creatorPara = document.getElementsByTagName('p')[0];
